<title>Landscape Engraver</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&display=swap">
<style>
  :root {
    color-scheme: dark;
    --ground: #17120e;
    --ground-2: #221a14;
    --paper: #ebe1c9;
    --ink: #1c140d;
    --text: #d9ccb0;
    --muted: #9a8a70;
    --rule: #3a2e24;
    --serif: "IM Fell English", "Iowan Old Style", Georgia, serif;
    --caps: "IM Fell English SC", "Iowan Old Style", Georgia, serif;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(ellipse at 50% 30%, var(--ground-2), var(--ground) 70%) fixed, var(--ground);
    color: var(--text);
    font-family: var(--serif);
    font-size: 17px;
    padding-inline: 16px;
    padding-block: 28px 40px;
    box-sizing: border-box;
  }
  main { max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
  header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  h1 { font-family: var(--caps); font-weight: 400; font-size: clamp(1.5rem, 4vw, 2.2rem); letter-spacing: 0.04em; margin: 0; color: var(--paper); text-wrap: balance; }
  header p { margin: 0; color: var(--muted); font-style: italic; }
  .plate {
    position: relative;
    background: var(--paper);
    box-shadow: 0 1px 0 #fff3 inset, 0 18px 50px #000a, 0 2px 6px #0008;
  }
  canvas.drawing { cursor: pointer; }
  canvas { display: block; width: 100%; height: auto; aspect-ratio: 3 / 2; max-width: 100%; }
  .status {
    position: absolute; inset: auto 0 0 0; height: 3px; background: transparent; overflow: hidden;
  }
  .status span { display: block; height: 100%; width: 0; background: var(--ink); opacity: 0.55; transition: width 0.15s linear; }
  .bar { display: flex; justify-content: space-between; align-items: center; gap: 14px; flex-wrap: wrap; }
  .caption { font-style: italic; font-size: 1.15rem; color: var(--text); }
  .caption .hint { color: var(--muted); font-size: 0.95rem; }
  .caption b { font-style: normal; font-family: var(--caps); font-weight: 400; letter-spacing: 0.05em; font-variant-numeric: tabular-nums; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; }
  button {
    font: inherit; font-family: var(--caps); letter-spacing: 0.06em; font-size: 1.05rem;
    padding: 10px 20px; cursor: pointer; border-radius: 2px;
    border: 1px solid var(--paper); background: var(--paper); color: var(--ink);
  }
  button.ghost { background: transparent; color: var(--paper); border-color: var(--rule); }
  button:hover { filter: brightness(1.06); }
  button.ghost:hover { border-color: var(--muted); }
  button:focus-visible { outline: 2px solid var(--paper); outline-offset: 3px; }
  button:disabled { opacity: 0.5; cursor: progress; }
  .viewer {
    position: fixed; inset: 0; background: #0d0a08ee; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; padding: 16px; z-index: 5;
  }
  .viewer img { max-width: 100%; max-height: 80%; box-shadow: 0 10px 40px #000; }
  .viewer p { margin: 0; color: var(--text); font-style: italic; text-align: center; }
  @media (prefers-reduced-motion: reduce) { .status span { transition: none; } }
</style>

<main>
  <header>
    <h1>Landscape Engraver</h1>
    <p>Each plate cut fresh from its own seed, stroke by stroke.</p>
  </header>
  <div class="plate">
    <canvas id="plate" width="1500" height="1000" aria-label="Engraved landscape"></canvas>
    <div class="status"><span id="progress"></span></div>
  </div>
  <div class="bar">
    <div class="caption" id="caption" aria-live="polite">Plate <b>No. —</b></div>
    <div class="actions">
      <button id="save" class="ghost" type="button">Save PNG</button>
      <button id="new" type="button">New plate</button>
    </div>
  </div>
</main>

<div class="viewer" id="viewer" hidden>
  <img id="shot" alt="Engraved landscape, full size">
  <p>Long-press (phone) or right-click (desktop) the image to save it.</p>
  <button id="close" class="ghost" type="button">Close</button>
</div>

<script src="draw.js"></script>
<script>
  const canvas = document.getElementById('plate');
  const bar = document.getElementById('progress');
  const caption = document.getElementById('caption');
  const saveBtn = document.getElementById('save');
  let token = { cancelled: true };
  let current = 0;

  async function draw(seed) {
    token.cancelled = true;
    token = { cancelled: false };
    current = seed;
    caption.innerHTML = `Engraving plate <b>No. ${seed}</b>… <span class="hint">tap the plate to finish</span>`;
    saveBtn.disabled = true;
    canvas.classList.add('drawing');
    const done = await Engraver.render(canvas, seed, { token, onProgress: p => (bar.style.width = (p * 100).toFixed(0) + '%') });
    if (!done) return;
    bar.style.width = '0';
    canvas.classList.remove('drawing');
    caption.innerHTML = `Plate <b>No. ${seed}</b>`;
    saveBtn.disabled = false;
  }

  const seedFromHash = () => { const n = parseInt(location.hash.slice(1), 10); return n > 0 ? n : 0; };
  const newSeed = () => 1 + (crypto.getRandomValues(new Uint32Array(1))[0] % 999999);

  document.getElementById('new').addEventListener('click', () => {
    const seed = newSeed();
    history.replaceState(null, '', '#' + seed);
    draw(seed);
  });
  window.addEventListener('hashchange', () => { const s = seedFromHash(); if (s && s !== current) draw(s); });

  canvas.addEventListener('click', () => (token.skip = true));

  saveBtn.addEventListener('click', () => {
    document.getElementById('shot').src = canvas.toDataURL('image/png');
    document.getElementById('viewer').hidden = false;
  });
  document.getElementById('close').addEventListener('click', () => (document.getElementById('viewer').hidden = true));

  draw(seedFromHash() || newSeed());
</script>
